# Multi-replica profile for clusters with metrics-server and an ingress controller.
config:
  webOrigin: https://litemcp.example.com
  apiOrigin: https://litemcp.example.com

mongodb:
  existingSecret: litemcp-production
  key: MONGODB_URI

auth:
  existingSecret: litemcp-production
  key: BETTER_AUTH_SECRET

autoscaling:
  server:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  web:
    enabled: true
    minReplicas: 3
    maxReplicas: 8

podDisruptionBudget:
  server:
    enabled: true
    minAvailable: 2
  web:
    enabled: true
    minAvailable: 2

server:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: '{{ include "litemcp.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
          app.kubernetes.io/component: server
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: '{{ include "litemcp.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
          app.kubernetes.io/component: server

web:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: '{{ include "litemcp.name" . }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
          app.kubernetes.io/component: web

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: litemcp.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: server
        - path: /mcp
          pathType: Prefix
          service: server
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: litemcp-tls
      hosts:
        - litemcp.example.com
