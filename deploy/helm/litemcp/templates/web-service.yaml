apiVersion: v1
kind: Service
metadata:
  name: {{ include "litemcp.web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litemcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  sessionAffinity: {{ .Values.web.service.sessionAffinity }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "litemcp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
