{{- if .Values.autoscaling.web.enabled }}
{{- if lt (int .Values.autoscaling.web.maxReplicas) (int .Values.autoscaling.web.minReplicas) }}
{{- fail "autoscaling.web.maxReplicas must be greater than or equal to minReplicas" }}
{{- end }}
{{- if and (not .Values.autoscaling.web.targetCPUUtilizationPercentage) (not .Values.autoscaling.web.targetMemoryUtilizationPercentage) }}
{{- fail "autoscaling.web requires at least one CPU or memory utilization target" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "litemcp.web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litemcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "litemcp.web.fullname" . }}
  minReplicas: {{ .Values.autoscaling.web.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.web.maxReplicas }}
  metrics:
    {{- with .Values.autoscaling.web.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.autoscaling.web.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with .Values.autoscaling.web.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
