name: Publish container images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        component:
          - server
          - web
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the validated image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/reachjalil/litemcp-${{ matrix.component }}:edge
            ghcr.io/reachjalil/litemcp-${{ matrix.component }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/reachjalil/liteMCP
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=LiteMCP Composer ${{ matrix.component }} image
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
