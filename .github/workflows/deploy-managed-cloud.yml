name: Deploy managed cloud

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: managed-cloud-production
  cancel-in-progress: false

env:
  NODE_VERSION: 24.11.1
  PNPM_VERSION: 10.30.2

jobs:
  deploy:
    name: Deploy and baseline-smoke managed cloud
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.MANAGED_CLOUD_AUTO_DEPLOY == 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: managed-cloud
      url: ${{ vars.MANAGED_CLOUD_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MANAGED_CLOUD_URL: ${{ vars.MANAGED_CLOUD_URL }}
      MANAGED_CLOUD_RESOURCES_READY: ${{ vars.MANAGED_CLOUD_RESOURCES_READY }}
    steps:
      - name: Check required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$MANAGED_CLOUD_URL"
          test "$MANAGED_CLOUD_RESOURCES_READY" = "true"
          case "$MANAGED_CLOUD_URL" in
            https://*) ;;
            *) printf 'MANAGED_CLOUD_URL must be an HTTPS origin.\n' >&2; exit 1 ;;
          esac
      - name: Check out the validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify the checked-in origin matches the deployment
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";

          const config = JSON.parse(
            readFileSync("apps/managed-cloud/wrangler.jsonc", "utf8")
          );
          const expected = process.env.MANAGED_CLOUD_URL.replace(/\/$/, "");
          const publicOrigin = String(config.vars?.PUBLIC_ORIGIN ?? "").replace(
            /\/$/,
            ""
          );
          const webOrigins = String(config.vars?.WEB_ORIGINS ?? "")
            .split(",")
            .map((origin) => origin.trim().replace(/\/$/, ""));
          if (publicOrigin !== expected || !webOrigins.includes(expected)) {
            throw new Error(
              "wrangler.jsonc PUBLIC_ORIGIN and WEB_ORIGINS must include the exact MANAGED_CLOUD_URL before deployment."
            );
          }
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Wrangler identity
        run: pnpm --filter @litemcp/managed-cloud exec wrangler whoami
      - name: Apply checked-in D1 migrations
        run: pnpm --filter @litemcp/managed-cloud db:migrate:remote
      - name: Deploy managed cloud
        run: pnpm managed-cloud:deploy
      - name: Run public baseline smoke
        run: ./scripts/smoke-managed-cloud.sh
      - name: Record acceptance boundary
        run: >-
          printf '%s\n'
          'Deployment and public baseline smoke passed. Live identity-provider, authenticated control-plane, scoped MCP, audit, and rollback acceptance must still be recorded before production-readiness is claimed.'
