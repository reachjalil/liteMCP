name: Deploy customer-owned Cloudflare reference staging

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full main-branch SHA already validated by CI
        required: true
        type: string
      ci_run_id:
        description: Successful CI run ID for the exact candidate
        required: true
        type: string
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: managed-cloud-staging
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.30.2

jobs:
  qualify:
    name: Qualify the latest successful main candidate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        vars.MANAGED_CLOUD_STAGING_AUTO_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      ci_run_attempt: ${{ steps.candidate.outputs.ci_run_attempt }}
      ci_run_id: ${{ steps.candidate.outputs.ci_run_id }}
    steps:
      - name: Check out trusted workflow controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse a disabled or non-main manual deployment
        env:
          DEPLOY_ENABLED: ${{ vars.CUSTOMER_OWNED_REFERENCE_DEPLOY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_ENABLED" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Verify the exact candidate and reject stale promotion
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          EVENT_CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" \
            >"$RUNNER_TEMP/ci-run.json"
          ci_run_attempt="$(node -e \
            'const run=require(process.argv[1]); process.stdout.write(String(run.run_attempt))' \
            "$RUNNER_TEMP/ci-run.json")"
          [[ "$ci_run_attempt" =~ ^[1-9][0-9]*$ ]]
          if test -n "$EVENT_CI_RUN_ATTEMPT"; then
            test "$ci_run_attempt" = "$EVENT_CI_RUN_ATTEMPT"
          fi
          node scripts/verify-workflow-evidence.mjs ci \
            "$RUNNER_TEMP/ci-run.json" \
            "$CANDIDATE_SHA" \
            "$CI_RUN_ID" \
            "$GITHUB_REPOSITORY" \
            "$ci_run_attempt"
          gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            >"$RUNNER_TEMP/latest-successful-ci.json"
          node scripts/verify-workflow-evidence.mjs latest \
            "$RUNNER_TEMP/latest-successful-ci.json" \
            "$CANDIDATE_SHA" \
            "$CI_RUN_ID" \
            "$ci_run_attempt"
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >>"$GITHUB_OUTPUT"
          printf 'ci_run_id=%s\n' "$CI_RUN_ID" >>"$GITHUB_OUTPUT"
          printf 'ci_run_attempt=%s\n' "$ci_run_attempt" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy and accept customer-owned reference staging
    needs:
      - qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: managed-cloud-staging
      url: ${{ vars.MANAGED_CLOUD_STAGING_URL }}
    steps:
      - name: Check out the validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.qualify.outputs.candidate_sha }}
          persist-credentials: false
      - name: Verify checked-out candidate
        env:
          CANDIDATE_SHA: ${{ needs.qualify.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Check required staging configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_MIGRATION_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
          MANAGED_CLOUD_URL: ${{ vars.MANAGED_CLOUD_STAGING_URL }}
          MANAGED_CLOUD_RESOURCES_READY: ${{ vars.MANAGED_CLOUD_STAGING_RESOURCES_READY }}
          MANAGED_CLOUD_MCP_ENDPOINT: ${{ vars.MANAGED_CLOUD_STAGING_MCP_ENDPOINT }}
          MANAGED_CLOUD_MCP_TOKEN: ${{ secrets.MANAGED_CLOUD_STAGING_MCP_TOKEN }}
          MANAGED_CLOUD_MCP_TOOL_NAME: ${{ vars.MANAGED_CLOUD_STAGING_MCP_TOOL_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_DEPLOY_API_TOKEN"
          test -n "$CLOUDFLARE_MIGRATION_API_TOKEN"
          test "$CLOUDFLARE_DEPLOY_API_TOKEN" != "$CLOUDFLARE_MIGRATION_API_TOKEN"
          test -n "$MANAGED_CLOUD_URL"
          test "$MANAGED_CLOUD_RESOURCES_READY" = "true"
          test -n "$MANAGED_CLOUD_MCP_ENDPOINT"
          test -n "$MANAGED_CLOUD_MCP_TOKEN"
          test -n "$MANAGED_CLOUD_MCP_TOOL_NAME"
          case "$MANAGED_CLOUD_URL" in
            https://*) ;;
            *) printf 'MANAGED_CLOUD_STAGING_URL must be an HTTPS origin.\n' >&2; exit 1 ;;
          esac
      - name: Verify staging isolation and checked-in resource IDs
        run: node scripts/check-managed-cloud-wrangler.mjs --require-staging-resource-ids
      - name: Verify the checked-in staging origin matches the deployment
        env:
          MANAGED_CLOUD_URL: ${{ vars.MANAGED_CLOUD_STAGING_URL }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";

          const config = JSON.parse(
            readFileSync("apps/managed-cloud/wrangler.jsonc", "utf8")
          ).env?.staging;
          const expected = process.env.MANAGED_CLOUD_URL.replace(/\/$/, "");
          const publicOrigin = String(config?.vars?.PUBLIC_ORIGIN ?? "").replace(
            /\/$/,
            ""
          );
          const webOrigins = String(config?.vars?.WEB_ORIGINS ?? "")
            .split(",")
            .map((origin) => origin.trim().replace(/\/$/, ""));
          if (publicOrigin !== expected || !webOrigins.includes(expected)) {
            throw new Error(
              "wrangler.jsonc env.staging PUBLIC_ORIGIN and WEB_ORIGINS must include the exact MANAGED_CLOUD_STAGING_URL."
            );
          }
          NODE
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download and verify the exact CI-built staging archive
        id: artifact
        env:
          CANDIDATE_SHA: ${{ needs.qualify.outputs.candidate_sha }}
          CI_RUN_ATTEMPT: ${{ needs.qualify.outputs.ci_run_attempt }}
          CI_RUN_ID: ${{ needs.qualify.outputs.ci_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="managed-cloud-artifact-staging-$CANDIDATE_SHA-run-$CI_RUN_ID-attempt-$CI_RUN_ATTEMPT"
          artifact_dir="$RUNNER_TEMP/managed-cloud-staging-artifact"
          payload_dir="$RUNNER_TEMP/managed-cloud-staging-payload"
          mkdir -p "$artifact_dir" "$payload_dir"
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$artifact_dir"
          archive="$artifact_dir/managed-cloud-staging.tar.gz"
          metadata="$artifact_dir/managed-cloud-staging.json"
          archive_sha256="$(node scripts/verify-managed-cloud-artifact.mjs verify \
            "$metadata" "$archive" "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" staging)"
          while IFS= read -r entry; do
            case "$entry" in
              assets/*|worker/*) ;;
              *) printf 'Unexpected archive entry: %s\n' "$entry" >&2; exit 1 ;;
            esac
            case "/$entry/" in
              */../*|*/./*) printf 'Unsafe archive entry: %s\n' "$entry" >&2; exit 1 ;;
            esac
          done < <(tar -tzf "$archive")
          tar --extract --gzip --file "$archive" --directory "$payload_dir" \
            --no-same-owner --no-same-permissions
          test -s "$payload_dir/worker/index.js"
          test -f "$payload_dir/assets/index.html"
          version_tag="lmc-stg-$CANDIDATE_SHA-$CI_RUN_ID-$CI_RUN_ATTEMPT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/verify-managed-cloud-artifact.mjs verify-tag "$version_tag" >/dev/null
          printf 'archive_sha256=%s\n' "$archive_sha256" >>"$GITHUB_OUTPUT"
          printf 'payload_dir=%s\n' "$payload_dir" >>"$GITHUB_OUTPUT"
          printf 'version_tag=%s\n' "$version_tag" >>"$GITHUB_OUTPUT"
      - name: Recheck latest CI after staging environment admission
        env:
          CANDIDATE_SHA: ${{ needs.qualify.outputs.candidate_sha }}
          CI_RUN_ATTEMPT: ${{ needs.qualify.outputs.ci_run_attempt }}
          CI_RUN_ID: ${{ needs.qualify.outputs.ci_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            >"$RUNNER_TEMP/latest-successful-ci-before-staging.json"
          node scripts/verify-workflow-evidence.mjs latest \
            "$RUNNER_TEMP/latest-successful-ci-before-staging.json" \
            "$CANDIDATE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT"
      - name: Verify Wrangler deploy identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @litemcp/managed-cloud exec wrangler whoami
      - name: Verify remote staging Durable Object lifecycle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm managed-cloud:do-lifecycle -- --env staging
      - name: Verify Wrangler migration identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @litemcp/managed-cloud exec wrangler whoami
      - name: Verify the Better Auth migration window
        env:
          BETTER_AUTH_1_7_MIGRATION_APPROVED_SHA: ${{ vars.BETTER_AUTH_1_7_MIGRATION_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ needs.qualify.outputs.candidate_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCIM_WRITES_FROZEN: ${{ vars.SCIM_WRITES_FROZEN }}
        run: pnpm managed-cloud:auth-migration-window -- --env staging
      - name: Upload the prebuilt staging Worker version
        id: worker
        env:
          ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_DIR: ${{ steps.artifact.outputs.payload_dir }}
          VERSION_TAG: ${{ steps.artifact.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          upload_log="$RUNNER_TEMP/wrangler-staging-upload.log"
          pnpm --filter @litemcp/managed-cloud exec wrangler versions upload \
            "$PAYLOAD_DIR/worker/index.js" \
            --config wrangler.jsonc \
            --no-bundle \
            --assets "$PAYLOAD_DIR/assets" \
            --env staging \
            --tag "$VERSION_TAG" \
            --message "CI archive sha256:$ARCHIVE_SHA256" \
            --strict 2>&1 | tee "$upload_log"
          version_id="$(node scripts/verify-managed-cloud-artifact.mjs \
            parse-version "$upload_log")"
          printf 'version_id=%s\n' "$version_id" >>"$GITHUB_OUTPUT"
      - name: Apply checked-in staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @litemcp/managed-cloud db:migrate:staging
      - name: Verify staging migration postflight
        env:
          CANDIDATE_SHA: ${{ needs.qualify.outputs.candidate_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm managed-cloud:auth-migration-window -- --env staging
      - name: Route staging traffic to the uploaded Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.worker.outputs.version_id }}
        run: >-
          pnpm --filter @litemcp/managed-cloud exec wrangler versions deploy
          --config wrangler.jsonc --env staging --version-id "$VERSION_ID" --yes
          --message "LiteMCP staging exact CI artifact"
      - name: Verify staging routes only to the uploaded Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.worker.outputs.version_id }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @litemcp/managed-cloud exec wrangler deployments list \
            --config wrangler.jsonc --env staging --json \
            >"$RUNNER_TEMP/staging-deployments.json"
          node scripts/verify-managed-cloud-artifact.mjs verify-deployment \
            "$RUNNER_TEMP/staging-deployments.json" "$VERSION_ID" >/dev/null
      - name: Run public and authenticated MCP staging smoke
        env:
          MANAGED_CLOUD_URL: ${{ vars.MANAGED_CLOUD_STAGING_URL }}
          MANAGED_CLOUD_MCP_ENDPOINT: ${{ vars.MANAGED_CLOUD_STAGING_MCP_ENDPOINT }}
          MANAGED_CLOUD_MCP_TOKEN: ${{ secrets.MANAGED_CLOUD_STAGING_MCP_TOKEN }}
          MANAGED_CLOUD_MCP_TOOL_NAME: ${{ vars.MANAGED_CLOUD_STAGING_MCP_TOOL_NAME }}
          MANAGED_CLOUD_MCP_TOOL_ARGUMENTS_JSON: ${{ vars.MANAGED_CLOUD_STAGING_MCP_TOOL_ARGUMENTS_JSON }}
        run: ./scripts/smoke-managed-cloud.sh
      - name: Write non-secret staging evidence
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          CANDIDATE_SHA: ${{ needs.qualify.outputs.candidate_sha }}
          CI_RUN_ATTEMPT: ${{ needs.qualify.outputs.ci_run_attempt }}
          CI_RUN_ID: ${{ needs.qualify.outputs.ci_run_id }}
          DEPLOYMENT_URL: ${{ vars.MANAGED_CLOUD_STAGING_URL }}
          WORKER_VERSION_ID: ${{ steps.worker.outputs.version_id }}
          WORKER_VERSION_TAG: ${{ steps.artifact.outputs.version_tag }}
        run: |
          node --input-type=module - <<'NODE'
          import { readdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const evidence = {
            version: 3,
            repository: process.env.GITHUB_REPOSITORY,
            candidate_sha: process.env.CANDIDATE_SHA,
            ci_run_id: Number(process.env.CI_RUN_ID),
            ci_run_attempt: Number(process.env.CI_RUN_ATTEMPT),
            staging_run_id: Number(process.env.GITHUB_RUN_ID),
            staging_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            deployment_target: "staging",
            deployment_url: process.env.DEPLOYMENT_URL,
            artifact_target: "staging",
            artifact_sha256: process.env.ARTIFACT_SHA256,
            worker_version_id: process.env.WORKER_VERSION_ID,
            worker_version_tag: process.env.WORKER_VERSION_TAG,
            migration_ids: readdirSync("apps/managed-cloud/migrations")
              .filter((name) => name.endsWith(".sql"))
              .sort(),
            public_smoke: true,
            authenticated_mcp_smoke: true,
            accepted_at: new Date().toISOString(),
          };
          writeFileSync(
            join(process.env.RUNNER_TEMP, "managed-cloud-staging-evidence.json"),
            `${JSON.stringify(evidence, null, 2)}\n`
          );
          NODE
          node scripts/verify-workflow-evidence.mjs staging-evidence \
            "$RUNNER_TEMP/managed-cloud-staging-evidence.json" \
            "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_REPOSITORY"
      - name: Publish immutable staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-cloud-staging-evidence-${{ needs.qualify.outputs.candidate_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-cloud-staging-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Record staging acceptance boundary
        run: >-
          printf '%s\n'
          'Staging accepted the exact CI candidate and attempt with public and authenticated MCP smoke. Identity/session issuance, audit correlation, revocation, rollback, load, and external security acceptance remain separate release gates.'
