[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "litemcp-sdk"
version = "0.1.0"
description = "Dependency-light Python client for LiteMCP Composer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "LiteMCP Composer contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/litemcp"]
